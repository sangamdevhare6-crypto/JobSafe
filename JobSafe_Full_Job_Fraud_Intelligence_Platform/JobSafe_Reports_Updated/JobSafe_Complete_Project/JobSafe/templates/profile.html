{% extends "base.html" %}{% block title %}Profile | JobSafe{% endblock %}{% block content %}<div class="app-shell">{% include "partials/sidebar.html" %}<main class="main"><header class="topbar"><div><h2>Profile</h2><p class="muted">Manage your JobSafe account identity.</p></div></header>{% if messages %}{% for m in messages %}<div class="notice success">{{ m }}</div>{% endfor %}{% endif %}<section class="panel glass form-panel"><form method="post">{% csrf_token %}<div class="form-grid"><div><label>First name</label><input name="first_name" value="{{ request.user.first_name }}"></div><div><label>Last name</label><input name="last_name" value="{{ request.user.last_name }}"></div><div><label>Username</label><input value="{{ request.user.username }}" disabled></div><div><label>Email</label><input type="email" name="email" value="{{ request.user.email }}"></div></div><button class="btn primary" type="submit">Save Profile</button></form></section></main></div>{% endblock %}
